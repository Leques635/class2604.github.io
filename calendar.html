<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程日历 · 班级主页</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f6ef7'/><text x='50' y='50' dy='.36em' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif'>班</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header data-header></header>

<main>
  <div class="wrap stack">
    <div class="notice-bar" data-draft-bar hidden></div>

    <section class="card">
      <div class="cal-head">
        <h2 class="cal-title" data-cal-title></h2>
        <button class="btn btn-sm btn-icon" data-nav-prev title="上个月" aria-label="上个月">‹</button>
        <button class="btn btn-sm btn-icon" data-nav-next title="下个月" aria-label="下个月">›</button>
        <button class="btn btn-sm" data-nav-today>今天</button>
        <div class="spacer"></div>
        <button class="btn btn-sm btn-primary no-print" data-new-event>＋ 新建日程</button>
      </div>

      <div class="cal-weekdays">
        <div>周日</div><div>周一</div><div>周二</div><div>周三</div>
        <div>周四</div><div>周五</div><div>周六</div>
      </div>
      <div class="cal-grid" data-cal-grid></div>

      <div class="card-sub" style="margin-top:14px">
        提示：打开编辑模式后，点日历里的任意一天就能新建日程；点已有日程可以修改。
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>近期日程</h2>
        <div class="spacer"></div>
        <span class="card-sub">按时间先后排列</span>
      </div>
      <div data-ev-list></div>
    </section>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/store.js"></script>
<script src="assets/js/publish.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/calendar.js"></script>
</body>
</html>
