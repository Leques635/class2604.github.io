<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级主页</title>
<meta name="description" content="班级日程与公告">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f6ef7'/><text x='50' y='50' dy='.36em' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif'>班</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">

<body>

<header data-header></header>

<main>
  <div class="wrap stack">
    <div class="notice-bar" data-draft-bar hidden></div>

    <div data-hero></div>

    <div data-stats></div>

    <div class="grid grid-2">
      <section class="card">
        <div class="card-head">
          <h2>日程</h2>
          <div class="spacer"></div>
          <a class="btn btn-sm" href="calendar.html">日历</a>
        </div>
        <div data-upcoming></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>班级公告</h2>
          <div class="spacer"></div>
          <button class="btn btn-sm btn-primary" data-new-notice data-edit-only hidden>＋ 添加公告</button>
        </div>
        <div data-notices></div>
      </section>
    </div>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/store.js"></script>
<script src="assets/js/publish.js"></script>
<script src="assets/js/ui.js"></script>
